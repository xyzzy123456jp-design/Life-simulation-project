; 場所移動のたびに再読込されるため、数値変更後のC++再ビルドは不要です。
; FVector: X=... Y=... Z=... / FRotator: P=... Y=... R=...
; キーを削除するとRealtimeTestActor.cppの従来値へフォールバックします。

[ConversationScene.Classroom]
OriginOffset=X=0 Y=0 Z=0
PlayerOffset=X=-500 Y=0 Z=170
PlayerRotation=P=0 Y=0 R=0
PlayerScale=X=1 Y=1 Z=1
; 教室モデルの内側(X=25170〜26970が箱の範囲)まで踏み込ませて、外から覗く見た目にならないようにする
JenniferOffset=X=800 Y=0 Z=-90
JenniferRotation=P=0 Y=180 R=0
; Jenniferは全シーンで起動時Canonical Scaleを維持する。背景との比率はBackgroundScaleで調整する。
JenniferScale=X=1 Y=1 Z=1
BackgroundOffset=X=0 Y=0 Z=0
; 表側がカメラと逆を向いていたため180度回転させて解決済み
BackgroundRotationOffset=P=0 Y=180 R=0
BackgroundScale=X=1 Y=1 Z=1
CameraOffset=X=-270 Y=0 Z=15
CameraFOV=65
; ライトの強弱では顔の影がほぼ変化しなかったため、露出補正で全体を持ち上げる
ExposureBias=-6.0

[ConversationScene.Cinema]
OriginOffset=X=0 Y=0 Z=0
PlayerOffset=X=-500 Y=0 Z=170
PlayerRotation=P=0 Y=0 R=0
PlayerScale=X=1 Y=1 Z=1
; シアタールームの内側(BackgroundScale=0.72適用後はX=45643〜46497が箱の範囲)まで踏み込ませて、外から覗く見た目にならないようにする
JenniferOffset=X=1200 Y=0 Z=-90
; 注: 映画館のJenniferの向きはTick内の自動追従ロジック(RealtimeTestActor.cpp)側で
; 「カメラの方を向く回転+180度」として毎フレーム上書きされるため、この値自体は使われない
JenniferRotation=P=0 Y=0 R=0
JenniferScale=X=1 Y=1 Z=1
BackgroundOffset=X=0 Y=0 Z=0
BackgroundRotationOffset=P=0 Y=0 R=0
BackgroundScale=X=0.72 Y=0.72 Z=0.72
; Jenniferの背後から、+X側にあるスクリーンを見る構図
CameraOffset=X=-270 Y=0 Z=95
CameraRotation=P=0 Y=0 R=0
CameraFOV=65
ExposureBias=-3.5

[ConversationScene.JenniferRoom]
OriginOffset=X=0 Y=0 Z=0
PlayerOffset=X=-500 Y=0 Z=170
PlayerRotation=P=0 Y=0 R=0
PlayerScale=X=1 Y=1 Z=1
; 教室と同様、Fabモデルの内側(箱の中心付近)まで踏み込ませる。
; Zを下げてソファに座っているような高さに近づける(アニメーション自体は立ちポーズのまま、位置合わせのみ)
JenniferOffset=X=1200 Y=0 Z=-170
JenniferRotation=P=0 Y=180 R=0
JenniferScale=X=1 Y=1 Z=1
; 元のX=300配置をX=1100相当まで離し、モデル内部への入り込みを防ぐ
BackgroundOffset=X=800 Y=0 Z=0
; 教室と同じく表側がカメラと逆を向いていた(黒い面しか見えない)ため180度回転
BackgroundRotationOffset=P=0 Y=180 R=0
; 6倍だとカメラに迫りすぎて露出が飛んで真っ白になったため3倍に縮小
BackgroundScale=X=3 Y=3 Z=3
CameraOffset=X=-270 Y=0 Z=10
CameraFOV=65
ExposureBias=-2.5

[ConversationScene.Walk]
OriginOffset=X=0 Y=0 Z=0
PlayerOffset=X=-500 Y=0 Z=170
PlayerRotation=P=0 Y=0 R=0
PlayerScale=X=1 Y=1 Z=1
JenniferOffset=X=0 Y=0 Z=-90
JenniferRotation=P=0 Y=180 R=0
JenniferScale=X=1 Y=1 Z=1
BackgroundOffset=X=0 Y=0 Z=0
BackgroundRotationOffset=P=0 Y=0 R=0
BackgroundScale=X=1 Y=1 Z=1
CameraOffset=X=-270 Y=0 Z=0
CameraFOV=65
ExposureBias=-2.5

[ConversationScene.Restaurant]
OriginOffset=X=0 Y=0 Z=0
PlayerOffset=X=-500 Y=0 Z=170
PlayerRotation=P=0 Y=0 R=0
PlayerScale=X=1 Y=1 Z=1
JenniferOffset=X=0 Y=0 Z=-90
JenniferRotation=P=0 Y=180 R=0
JenniferScale=X=1 Y=1 Z=1
BackgroundOffset=X=0 Y=0 Z=0
BackgroundRotationOffset=P=0 Y=0 R=0
BackgroundScale=X=1 Y=1 Z=1
CameraOffset=X=-270 Y=0 Z=0
CameraFOV=65
; ライトを暗くしても見た目が変化しなかったため、露出補正で全体を落とす
